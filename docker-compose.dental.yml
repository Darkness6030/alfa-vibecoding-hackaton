# Dental deployment (K7). Separate Compose project name to avoid touching
# existing services. Deploy with:
#   docker compose -p alfagen -f docker-compose.dental.yml up -d
services:
  redis:
    image: redis:7.4-alpine
    container_name: alfagen-dental-redis
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    image: alfagen-pii-guard:0.1.0-amd64
    container_name: alfagen-dental-api
    depends_on:
      redis:
        condition: service_healthy
    environment:
      ALFAGEN_PROFILE: evaluation-open
      ALFAGEN_ENGINE_STUB: "true"
      ALFAGEN_REDIS_URL: redis://redis:6379/0
      ALFAGEN_STATE_NAMESPACE: evaluation-open
      ALFAGEN_STATE_CONSUMER: stand
      ALFAGEN_STATE_TTL_SECONDS: "900"
      # Shared encryption key across workers (required for multi-worker demask).
      ALFAGEN_ENCRYPTION_KEY: "${ALFAGEN_ENCRYPTION_KEY:-}"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s